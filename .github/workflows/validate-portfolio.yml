name: Validate portfolio
on:
  push:
    branches:
      - feature/portfolio-trilingue
  pull_request:
    branches:
      - desenvolvimento
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run check:i18n
